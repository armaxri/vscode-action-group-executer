<body>
<script>if (new URLSearchParams(location.search).get("theme") === "light") { document.documentElement.classList.add("light"); }</script>
<div id="app"></div>
<script>
var exports = {};
window.harnessLog = [];
const W = "2:", A = "3:file:///app", L = "3:file:///lib", U = "1:";
let groups = [
  { id: W + "#0", targetId: W, folderPath: "Build", processLines: [], config: { name: "Build everything", groupNames: [{ name: "Build", sortingIndex: 1 }], tasks: [{ name: "build", workspaceName: "app" }, { name: "build", workspaceName: "lib" }] } },
  { id: W + "#1", targetId: W, folderPath: "Debug", processLines: [], config: { name: "Debug app and lib", groupNames: [{ name: "Debug", sortingIndex: 2 }], debugSession: { namedConfiguration: "App + Lib" } } },
  { id: A + "#0", targetId: A, folderPath: "Run", processLines: ["node app.js process"], config: { name: "Serve app", groupNames: [{ name: "Run", sortingIndex: 3 }], terminals: [{ name: "App server", command: "node app.js terminal", extendedOptions: { cwd: "${workspaceFolder}" } }], processes: [{ name: "App process", command: { call: ["node", "app.js", "process"], extendedOptions: { cwd: "${workspaceFolder}" } } }] } },
];
const state = () => ({
  targets: [{ id: W, label: "Workspace Settings" }, { id: A, label: "Workspace Folder Settings (app)" }, { id: L, label: "Workspace Folder Settings (lib)" }, { id: U, label: "User Settings" }],
  groups: JSON.parse(JSON.stringify(groups)),
  choices: {
    tasks: [
      { name: "build", source: "Workspace", folder: "app" }, { name: "build", source: "Workspace", folder: "lib" }, { name: "build", source: "npm", folder: "app" },
      { name: "failing check", source: "Workspace", folder: "app" }, { name: "serve", source: "Workspace", folder: "app" }, { name: "test", source: "Workspace", folder: "lib" }, { name: "watch", source: "npm", folder: "app" },
    ],
    commands: [
      { id: "action-group-executer.killAllProcesses", title: "ActionGroupExec: Kill all Background Processes" },
      { id: "clangd.restart", title: "clangd: Restart language server" },
      { id: "workbench.action.files.saveAll", title: "File: Save All Files" },
      { id: "workbench.action.reloadWindow" },
    ],
    launches: [
      { name: "Run app", folder: "app", location: "app", detail: "node · launch" },
      { name: "Run lib tests", folder: "lib", location: "lib", detail: "node · launch" },
      { name: "App + Lib", location: "Workspace", detail: "compound" },
    ],
    folderPaths: ["Build", "Debug", "Run"],
    multiRoot: true,
  },
});
const send = (message) => setTimeout(() => window.postMessage(message, "*"), 50);
function acquireVsCodeApi() {
  return {
    postMessage(message) {
      window.harnessLog.push(JSON.parse(JSON.stringify(message)));
      if (message.type === "ready") { send({ type: "state", state: state() }); }
      if (message.type === "save") {
        const request = message.request;
        if (!request.config.name.trim()) { send({ type: "result", requestId: message.requestId, result: { ok: false, error: "The action group needs a name." }, state: state() }); return; }
        let id = request.id;
        const entry = { id: "", targetId: request.targetId, folderPath: request.folderPath, processLines: request.processLines, config: request.config };
        if (id) { const index = groups.findIndex((g) => g.id === id); groups[index] = { ...entry, id }; }
        else { id = request.targetId + "#" + groups.filter((g) => g.targetId === request.targetId).length; groups.push({ ...entry, id }); }
        send({ type: "result", requestId: message.requestId, result: { ok: true, select: id }, state: state() });
      }
      if (message.type === "delete") {
        groups = groups.filter((g) => g.id !== message.request.id);
        send({ type: "result", requestId: message.requestId, result: { ok: true }, state: state() });
      }
    },
  };
}
</script>
<script src="../../out/webview/actionGroupEditor.js"></script>

</body>
