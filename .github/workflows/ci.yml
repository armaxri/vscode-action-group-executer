name: CI

on:
  push:
    branches: ["**"]
    tags: ["release/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix: ${{ steps.version.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            version="${GITHUB_REF#refs/tags/release/}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${GITHUB_REF#refs/tags/}' does not match release/x.y.z"
              exit 1
            fi
          else
            version="99.99.99"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=action-group-executer-$version.vsix" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Compile and lint
        run: npm run pretest

      - name: Test
        run: xvfb-run -a npm test

      - name: Package
        run: npx vsce package -o "${{ steps.version.outputs.vsix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.version.outputs.vsix }}

  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Replace development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "${{ needs.build.outputs.vsix }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development Build" \
            --notes "Automated build of \`master\` at ${GITHUB_SHA::7}. Version \`99.99.99\`; replaced on every push to \`master\`."

  release:
    if: startsWith(github.ref, 'refs/tags/release/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No CHANGELOG section found for $VERSION"
            echo "Release $VERSION" > notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" "${{ needs.build.outputs.vsix }}" \
            --verify-tag \
            --latest \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file notes.md
