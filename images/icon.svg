    24.28,59.84
    26,58
    27.72,59.84
    30.24,59.76
    30.16,62.28
  " fill="#1E1E1E"/>
  <circle cx="26" cy="64" r="2.5" fill="#CE9178"/>

  <!-- Debug bar (blue) -->
  <rect x="14" y="82" width="62" height="16" rx="4" fill="#569CD6"/>
  <!-- Bug icon: body + 2 antennae + 6 legs -->
  <ellipse cx="26" cy="91" rx="4" ry="5" fill="#1E1E1E"/>
  <line x1="23" y1="88" x2="21" y2="85" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="88" x2="31" y2="85" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="89" x2="19" y2="88" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="92" x2="19" y2="92" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="95" x2="19" y2="96" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="89" x2="33" y2="88" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="92" x2="33" y2="92" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="95" x2="33" y2="96" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round"/>

